<style>
  :root {
    --red: #a51f24;
    --orange: #f28a3c;
    --ink: #1d232b;
    --muted: #5d6670;
    --bg: #f4f5f7;
    --card: #ffffff;
    --line: #e3e6ea;
    --wa: #1fa855;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    line-height: 1.5;
    padding-bottom: 88px;
  }
  header {
    background: var(--card);
    text-align: center;
    padding: 12px 16px 16px;
    border-bottom: 4px solid var(--red);
  }
  header img {
    width: 170px; height: 72px;
    object-fit: cover; object-position: 50% 42%;
    display: block; margin: 0 auto;
  }
  h1 { font-size: 21px; margin: 6px 0 2px; }
  .updated { color: var(--muted); font-size: 13px; margin: 0; }
  nav {
    position: sticky; top: 0; z-index: 5;
    background: rgba(244,245,247,.96);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
    display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: 0 0 auto;
    text-decoration: none; color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 15px; font-weight: 600;
  }
  nav a:active { background: var(--red); color: #fff; }
  main { max-width: 820px; margin: 0 auto; padding: 8px 10px; }
  section { margin: 18px 0 26px; }
  h2 {
    font-size: 19px; margin: 0 4px 10px;
    padding-inline-start: 10px;
    border-inline-start: 5px solid var(--orange);
  }
  .page {
    display: block; width: 100%; height: auto;
    background: var(--card);
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    margin-bottom: 12px;
  }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .wa {
    position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 10;
    max-width: 520px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--wa); color: #fff; text-decoration: none;
    font-size: 17px; font-weight: 700;
    padding: 14px 16px; border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .wa svg { width: 22px; height: 22px; fill: #fff; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 16px 16px; }
</style>
</head>
